<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daravath Saathvik | Game Designer</title>
  <meta name="description" content="Game designer pursuing a Master of Design in Digital Game Design at NID, with experience in digital marketing, paid media and visual design.">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="Daravath Saathvik | Game Designer">
  <meta property="og:description" content="Game designer pursuing a Master of Design in Digital Game Design at NID, with experience in digital marketing, paid media and visual design.">
  <meta name="theme-color" content="#070a14">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script src="js/main.js" defer></script>
  <script src="js/game.js" defer></script>
</head>
<body class="is-loading">
  <canvas class="bg-canvas" id="bg-canvas" aria-hidden="true"></canvas>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#top" data-bind="name">Portfolio</a>
      <div class="hud">
        <span class="hud-stage pixel" aria-hidden="true">Start</span>
        <button class="hud-btn pixel game-toggle" type="button" aria-pressed="true" hidden>Game on</button>
        <button class="hud-btn pixel theme-toggle" type="button">Lights on</button>
      </div>
      <nav class="site-nav" aria-label="Main">
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-list">
          <span class="nav-toggle-bar"></span>
          <span class="visually-hidden">Menu</span>
        </button>
        <ul class="nav-list" id="nav-list">
          <li><a href="#about">About</a></li>
          <li data-section="skills"><a href="#skills">Skills</a></li>
          <li data-section="projects"><a href="#projects">Projects</a></li>
          <li data-section="experience"><a href="#experience">Experience</a></li>
          <li data-section="education"><a href="#education">Education</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </div>
    <div class="xp-bar" aria-hidden="true"><span class="xp-fill"></span></div>
  </header>

  <main id="main">
    <section class="hero" id="top">
      <div class="container hero-inner">
        <div class="hero-text">
          <h1 class="hero-name" data-bind="name">&nbsp;</h1>
          <p class="hero-role" data-bind="role"></p>
          <p class="hero-tagline" data-bind="tagline"></p>
          <div class="hero-actions" data-slot="actions"></div>
        </div>
        <div class="hero-photo" data-slot="photo"></div>
      </div>
      <div class="container">
        <div data-slot="savefile"></div>
      </div>
    </section>

    <section class="section" id="about" aria-labelledby="about-title">
      <div class="container">
        <h2 class="section-title" id="about-title"><span class="stage" aria-hidden="true"></span><span class="title-text">About</span></h2>
        <div data-slot="about"></div>
      </div>
    </section>

    <section class="section" id="skills" aria-labelledby="skills-title">
      <div class="container">
        <h2 class="section-title" id="skills-title"><span class="stage" aria-hidden="true"></span><span class="title-text">Skills</span></h2>
        <ul class="skill-list" data-slot="skills"></ul>
      </div>
    </section>

    <section class="section" id="projects" aria-labelledby="projects-title">
      <div class="container">
        <h2 class="section-title" id="projects-title"><span class="stage" aria-hidden="true"></span><span class="title-text">Projects</span></h2>
        <ol class="level-select" data-slot="projects"></ol>
      </div>
    </section>

    <section class="section" id="experience" aria-labelledby="experience-title">
      <div class="container">
        <h2 class="section-title" id="experience-title"><span class="stage" aria-hidden="true"></span><span class="title-text">Experience</span></h2>
        <ol class="log" data-slot="experience"></ol>
      </div>
    </section>

    <section class="section" id="education" aria-labelledby="education-title">
      <div class="container">
        <h2 class="section-title" id="education-title"><span class="stage" aria-hidden="true"></span><span class="title-text">Education</span></h2>
        <ol class="log" data-slot="education"></ol>
        <div data-slot="certifications"></div>
      </div>
    </section>

    <section class="section" id="contact" aria-labelledby="contact-title">
      <div class="container">
        <h2 class="section-title" id="contact-title"><span class="stage" aria-hidden="true"></span><span class="title-text">Contact</span></h2>
        <div data-slot="contact"></div>
      </div>
    </section>

    <noscript>
      <div class="container noscript">This portfolio needs JavaScript to load its content.</div>
    </noscript>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; <span data-bind="year"></span> <span data-bind="name"></span></p>
      <a href="#top">Back to top ↑</a>
    </div>
  </footer>

  <canvas class="fx-canvas" id="fx-canvas" aria-hidden="true"></canvas>
  <div class="reticle" aria-hidden="true">
    <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="9"/><path d="M16 1v7M16 24v7M1 16h7M24 16h7"/><rect x="15" y="15" width="2" height="2"/></svg>
  </div>
  <div class="achievements" aria-live="polite"></div>
</body>
</html>
